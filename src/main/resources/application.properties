spring.application.name=grupoK

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:medicacion
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# JPA crea la tabla a partir de la entidad y muestra las consultas SQL en la terminal
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Carga los datos de data.sql después de crear las tablas
spring.jpa.defer-datasource-initialization=true
